<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level Up</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f0f1a;
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
      }

      h1 {
        color: #7c5cff;
        margin-bottom: 0.35em;
      }

      .sub {
        margin: 0;
        opacity: 0.85;
      }

      .stats {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .xp {
        font-size: 18px;
        color: #00ffb3;
      }

      .level {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.75);
      }

      .bar-wrap {
        width: min(420px, 90%);
        height: 10px;
        background: #1c1c2e;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 6px;
      }

      .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #7c5cff, #00ffb3);
        border-radius: 999px;
        transition: width 0.25s ease;
      }

      .row-input {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: 520px;
        margin-left: auto;
        margin-right: auto;
      }

      input {
        padding: 10px 12px;
        flex: 1 1 220px;
        min-width: 0;
        border-radius: 10px;
        border: none;
        font-size: 16px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: #7c5cff;
        color: white;
        cursor: pointer;
        font-size: 15px;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 22px auto 0;
        max-width: 520px;
      }

      li {
        background: #1c1c2e;
        padding: 12px 14px;
        margin: 8px auto;
        border-radius: 10px;
        text-align: left;
        cursor: pointer;
        border: 2px solid transparent;
        transition: opacity 0.2s ease, border-color 0.2s ease;
      }

      li.done {
        text-decoration: line-through;
        opacity: 0.55;
        cursor: default;
      }

      li:not(.done):hover {
        border-color: rgba(124, 92, 255, 0.45);
      }

      .hint {
        margin-top: 14px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.55);
        max-width: 520px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.45;
      }

      .hint code {
        font-size: 0.92em;
        background: #1c1c2e;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <h1>Level Up</h1>
    <p class="sub">Complete tasks → gain XP</p>

    <div class="stats">
      <div class="xp">XP: <span id="xp">0</span></div>
      <div class="level">
        Rank: <span id="level">Recruit</span><span id="level-detail"></span>
      </div>
      <div class="bar-wrap" aria-hidden="true">
        <div id="xpBar" class="bar-fill" style="width: 0%"></div>
      </div>
    </div>

    <div class="row-input">
      <input id="taskInput" type="text" placeholder="Enter a quest..." autocomplete="off" />
      <button type="button" id="addBtn">Add</button>
    </div>

    <ul id="list" aria-label="Quest list"></ul>

    <p class="hint">
      Same data as <code>index.html</code> (<code>levelup_v1</code>). Open via a local server so ES modules load (e.g.
      <code>npx serve .</code> from the <code>levelup</code> folder).
    </p>

    <script type="module" src="./js/simple-board.js"></script>
  </body>
</html>
